name: Collect military aircraft data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect data
        run: python scripts/collect.py

      - name: Commit and push
        run: |
          git config user.name "military-watch-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
